[supervisord]
nodaemon=true
logfile=/logs/supervisord.log
logfile_maxbytes=50MB
loglevel=info
pidfile=/var/run/supervisord.pid

[program:mediamtx]
command=/usr/local/bin/mediamtx /etc/mediamtx.yml
autostart=true
autorestart=true
priority=1
stdout_logfile=/logs/mediamtx.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/logs/mediamtx.err.log
stderr_logfile_maxbytes=10MB
environment=MEDIAMTX_RTMPADDRESS=":1935",MEDIAMTX_HLSADDRESS=":8890",MEDIAMTX_WEBRTCADDRESS=":8889"

[program:websocket]
command=node ws-server.js
directory=/app
autostart=true
autorestart=true
priority=2
stdout_logfile=/logs/websocket.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/logs/websocket.err.log
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",PORT="8082"

[program:nextjs]
command=npm start
directory=/app
autostart=true
autorestart=true
priority=3
stdout_logfile=/logs/nextjs.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/logs/nextjs.err.log
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"

[program:yt-dlp-updater]
command=/bin/sh -c "while true; do pip3 install --upgrade --no-cache-dir --break-system-packages yt-dlp; sleep 86400; done"
autostart=true
autorestart=true
priority=0
stdout_logfile=/logs/updater.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/logs/updater.err.log
stderr_logfile_maxbytes=1MB

[group:kathreftestr]
programs=mediamtx,websocket,nextjs,yt-dlp-updater

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock