services:
  # Main Web Service - Next.js app with MediaMTX bundled
  - type: web
    name: nostr-stream-bridge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HLS_BASE
        sync: false
      - key: RTMP_URL
        value: rtmp://localhost:1935/live
      - key: NOSTR_RELAYS
        value: wss://relay.damus.io,wss://relay.snort.social,wss://relay.primal.net,wss://nos.lol,wss://relay.nostr.band
      - key: DEFAULT_THUMB
        value: https://placehold.co/1200x630?text=Nostr+Live
      - key: RETURN_NSEC
        value: false
      - key: LIGHTNING_DOMAIN
        value: npub.cash