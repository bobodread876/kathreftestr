# MediaMTX Configuration
logLevel: info
logDestinations: [stdout]

# RTMP Server Configuration
rtmp: yes
rtmpAddress: :1935

# HLS Server Configuration  
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsVariant: lowLatency

# Disable WebRTC to avoid port conflicts
webrtc: no

# Path Configuration
paths:
  all_others: