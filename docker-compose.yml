version: '3.8'

services:
  # Option 1: All-in-one container (recommended for simple deployments)
  kathreftestr:
    build:
      context: .
      dockerfile: Dockerfile.unified
    container_name: kathreftestr
    restart: unless-stopped
    ports:
      - "3000:3000"   # Next.js app
      - "8082:8082"   # WebSocket server
      - "1935:1935"   # RTMP
      - "8888:8888"   # MediaMTX API
      - "8889:8889"   # WebRTC
      - "8890:8890"   # HLS
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL:-http://localhost:3000}
      - WS_URL=${WS_URL:-ws://localhost:8082}
      - RTMP_URL=${RTMP_URL:-rtmp://localhost:1935}
      - HLS_URL=${HLS_URL:-http://localhost:8890}
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./recordings:/recordings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.kathreftestr.rule=Host(`kathreftestr.local`)"

  # Option 2: Multi-container setup (uncomment for advanced deployments)
