version: '3.8'

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "1935:1935"     # RTMP in
      - "8888:8888"     # HTTP(HLS)
      - "8889:8889"     # RTSP (not used here)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx", "/mediamtx.yml"]
    restart: unless-stopped