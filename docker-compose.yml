# One-command self-host: `docker compose up -d` → http://localhost:3000
# Everything (app + MediaMTX + ffmpeg + yt-dlp) is in the single image.
services:
  kathreftestr:
    build: .
    image: ghcr.io/bobodread876/kathreftestr:latest
    restart: unless-stopped
    ports:
      - "3000:3000"   # web UI + API + HLS proxy
    environment:
      # Public base for the HLS the Nostr event advertises. For LAN/home use,
      # set this to where viewers reach you, e.g. http://<host>:3000/live
      # or a reverse-proxied https URL. Defaults to localhost for local dev.
      HLS_BASE: ${HLS_BASE:-http://localhost:3000/live}
      # Comma-separated relays to publish to (defaults are sane if unset).
      NOSTR_RELAYS: ${NOSTR_RELAYS:-}
    volumes:
      - kathreftestr-data:/data
volumes:
  kathreftestr-data:
