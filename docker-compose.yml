
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "1935:1935"     # RTMP in
      - "8890:8888"     # HTTP(HLS) - mapped to 8890 to avoid conflict
      - "8889:8889"     # RTSP (not used here)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
